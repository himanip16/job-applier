<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Sign in - Google Accounts</title></head>
<body>
<!--
  Verbatim shape of accounts.google.com/v3/signin/identifier: a heading, one
  sentence, and an email box. No password field, no "sign in to apply".
-->
<h1>Sign in</h1>
<p>Use your Google Account</p>
<form>
  <label for="identifier">Email or phone</label>
  <input id="identifier" name="identifier" type="email" autocomplete="username" />
  <button type="button">Next</button>
</form>
</body>
</html>
